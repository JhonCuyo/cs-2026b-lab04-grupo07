name: CI Lab 07 - Pytest y Complejidad Ciclomatica (Radon)

on:
  push:
    branches: [ main, "feat/**" ]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/ci-patrones-lab07.yml"
  pull_request:
    branches: [ main ]

jobs:
  test-and-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar pytest y radon
        run: |
          python -m pip install --upgrade pip
          pip install pytest radon pylint

      - name: Ejecutar suite de pruebas (Caracterizacion + Patrones)
        run: |
          pytest -v

      - name: Reporte completo de complejidad con radon
        run: |
          radon cc -s -a src/pedidos/servicio.py src/pedidos/pagos.py src/pedidos/estados.py src/pedidos/eventos.py src/pedidos/ia.py
          radon raw -s src/pedidos/

      - name: Quality Gate - Fallar si algun metodo refactorizado supera complejidad 10 (Grado C o peor)
        run: |
          salida=$(radon cc --min C src/pedidos/servicio.py src/pedidos/pagos.py src/pedidos/estados.py src/pedidos/eventos.py src/pedidos/ia.py)
          if [ -n "$salida" ]; then
            echo "ERROR: Se encontraron metodos con complejidad ciclomatica >= 11 (Grado C o peor):"
            echo "$salida"
            exit 1
          fi
          echo "OK: Todos los metodos refactorizados tienen complejidad A o B (<= 10)."