name: fitness-functions

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  arquitectura:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias (import-linter y pytest)
        run: |
          python -m pip install --upgrade pip
          pip install import-linter pytest

      - name: Ejecutar Fitness Functions Estructurales (FF-01 y FF-02)
        run: lint-imports

      - name: Ejecutar Fitness Functions de Calidad (FF-03 a FF-06)
        run: pytest -v tests/test_fitness.py